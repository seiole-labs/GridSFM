version: 1
profile: paper_id_mixed

transform_order:
  - load
  - generator_outage
  - branch_derating
  - voltage_tightening
  - cost_shuffle

perturbations:
  load:
    activation_probability: 1.0
    system_factor_min: 0.8
    system_factor_max: 1.5
    per_load_jitter_min: 0.9
    per_load_jitter_max: 1.1
    share_pd_qd_jitter: false

  generator_outage:
    activation_probability: 0.30
    outage_count_values: [1, 2, 3]
    outage_count_probabilities: [0.70, 0.20, 0.10]
    minimum_active_generators: 2
    minimum_pmax: 0.01
    selection_weight: pmax

  branch_derating:
    activation_probability: 0.20
    selected_branch_fraction: 0.10
    rating_factor_min: 0.70
    rating_factor_max: 0.95

  voltage_tightening:
    activation_probability: 0.15
    selected_bus_fraction: 0.10
    vmin_increase_min: 0.0
    vmin_increase_max: 0.01
    vmax_decrease_min: 0.0
    vmax_decrease_max: 0.01

  cost_shuffle:
    activation_probability: 1.0
    selected_generator_fraction: 0.40
    group_by_cost_degree: true

