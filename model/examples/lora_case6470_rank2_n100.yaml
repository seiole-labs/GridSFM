# Rank-2 case6470 graph sweep: 100 training graphs, physical batch 4.
# Paths are relative to the repository root unless absolute.
schema_version: 1

run:
  name: case6470_lora_r2_a2_n100_e8_b4
  seed: 42
  device: cuda
  output_root: artifacts/lora_rank2_b4_runs
  timestamp_format: "%Y%m%dT%H%M%S%z"
  fail_if_output_exists: true

model:
  checkpoint: model/checkpoints/gridsfm_open_v1.1.pt

adapter:
  checkpoint: null
  target: gridblock_ffn
  rank: 2
  alpha: 2.0
  dropout: 0.0

data:
  root: .cache/opfdata_lora1000
  case_name: pglib_opf_case6470_rte
  num_groups: 1
  cache_graphs:
    train: 1000
    val: 750
    test: 750
  train:
    variant: fulltop
    split: train
    graphs: 100
  validation:
    variant: fulltop
    split: val
    graphs: 750
  tests:
    fulltop:
      variant: fulltop
      split: test
      graphs: 750
    n1:
      variant: n1
      split: test
      graphs: 750
  synthetic_training:
    enabled: true
    infeasible_probability: 0.30
    mode_weights: [0.25, 0.20, 0.20, 0.35]

loader:
  batch_size: 4
  shuffle_training: true
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  drop_last: false

training:
  epochs: 8
  gradient_accumulation_steps: 1
  gradient_clip_norm: 5.0
  optimizer:
    name: adamw
    initial_learning_rate: 0.001
    final_learning_rate: 0.00001
    weight_decay: 0.0
    betas: [0.9, 0.999]
    epsilon: 0.00000001
    amsgrad: false
  scheduler:
    name: cosine
    interval: optimizer_step
  checkpoint_selection:
    metric: val_loss
    mode: min
  loss_kwargs:
    lambda_feas: 0.1
    lambda_cost: 1.0
    lambda_stress_feas: 0.1
    lambda_kcl_p: 1.0
    lambda_kcl_q: 1.0
    lambda_br_p: 1.0
    lambda_br_q: 1.0
    lambda_therm: 1.0
    lambda_thermal_limit: 5.0

logging:
  metrics_jsonl: metrics.jsonl
  learning_rate_png: learning_rate.png
  train_validation_loss_png: train_validation_loss.png
  config_snapshot: config.yaml
  best_adapter: best_adapter.pt
  final_adapter: final_adapter.pt
  log_every_optimizer_steps: 1
  plot_width: 960
  plot_height: 540

evaluation:
  compare_base_and_adapter: true
