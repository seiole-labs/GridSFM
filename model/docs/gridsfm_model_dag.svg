<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="title desc">
<title id="title">GridSFM model DAG</title>
<desc id="desc">Shape-aware directed acyclic graph of the GridSFM model.</desc>
<defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
          </marker>
          <style>
            .title { font: 700 28px ui-sans-serif, system-ui, sans-serif; fill: #eaf0ff; }
            .subtitle { font: 14px ui-monospace, SFMono-Regular, monospace; fill: #9fb0d0; }
            .box-title { font: 700 16px ui-sans-serif, system-ui, sans-serif; fill: #f7f9ff; }
            .box-text { font: 13px ui-monospace, SFMono-Regular, monospace; fill: #cbd5e1; }
            .edge-label { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #9fb0d0; }
            .edge { stroke: #718096; stroke-width: 2; fill: none; marker-end: url(#arrow); }
            .context { stroke: #8467d7; stroke-width: 2; stroke-dasharray: 7 5;
                       fill: none; marker-end: url(#arrow); }
          </style>
        </defs>
<rect width="1600" height="1580" fill="#091225"/>
<text x="50" y="48" class="title">GridSFM model DAG</text>
<text x="50" y="75" class="subtitle">15,148,227 parameters · 8 blocks · hidden=128 · sample shapes from 500 buses</text>
<rect x="30" y="105" width="205" height="105" rx="12" fill="#252052" stroke="#8467d7" stroke-width="2"/>
<text x="44" y="132" class="box-title">bus</text>
<text x="44" y="156" class="box-text">x [500, 16]</text>
<text x="44" y="175" class="box-text">Hodge PE +8</text>
<text x="44" y="194" class="box-text">encode -&gt; [500,128]</text>
<rect x="252" y="105" width="205" height="105" rx="12" fill="#172a4c" stroke="#52678f" stroke-width="2"/>
<text x="266" y="132" class="box-title">generator</text>
<text x="266" y="156" class="box-text">x [171, 11]</text>
<text x="266" y="175" class="box-text">no Hodge PE</text>
<text x="266" y="194" class="box-text">encode -&gt; [171,128]</text>
<rect x="474" y="105" width="205" height="105" rx="12" fill="#172a4c" stroke="#52678f" stroke-width="2"/>
