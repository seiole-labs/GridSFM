<text x="1154" y="156" class="box-text">x [192, 15]</text>
<text x="1154" y="175" class="box-text">Hodge PE +8</text>
<text x="1154" y="194" class="box-text">encode -&gt; [192,128]</text>
<rect x="1362" y="105" width="205" height="105" rx="12" fill="#252052" stroke="#8467d7" stroke-width="2"/>
