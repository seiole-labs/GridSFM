<text x="364" y="551" class="box-text">bus &lt;- self + AC + transformer + generator + load + shunt + cycle</text>
<text x="364" y="570" class="box-text">generator &lt;- self + fused bus</text>
<text x="364" y="589" class="box-text">global &lt;- mean/max pools of bus/AC/transformer/cycle: 1024 -&gt; 128</text>
<path d="M 800 425 V 462 H 800 V 500" class="edge"/>
