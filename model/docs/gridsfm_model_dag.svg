<text x="1376" y="156" class="box-text">x [229, 4]</text>
<text x="1376" y="175" class="box-text">Hodge PE +8</text>
<text x="1376" y="194" class="box-text">encode -&gt; [229,128]</text>
<rect x="255" y="285" width="1090" height="140" rx="12" fill="#132f43" stroke="#2d8f9f" stroke-width="2"/>
<text x="269" y="312" class="box-title">GridBlock × 8</text>
<text x="269" y="336" class="box-text">pre-LN -&gt; 4-head linear self-attention -&gt; residual</text>
<text x="269" y="355" class="box-text">pre-LN -&gt; 14-relation heterogeneous GNN -&gt; sum -&gt; residual</text>
<text x="269" y="374" class="box-text">pre-LN -&gt; FFN 128 -&gt; 512 -&gt; 128 -&gt; residual</text>
<text x="269" y="393" class="box-text">all seven streams retain [N_type,128]</text>
<path d="M 132 210 V 247 H 800 V 285" class="edge"/>
<path d="M 354 210 V 247 H 800 V 285" class="edge"/>
<path d="M 576 210 V 247 H 800 V 285" class="edge"/>
<path d="M 798 210 V 247 H 800 V 285" class="edge"/>
<path d="M 1020 210 V 247 H 800 V 285" class="edge"/>
<path d="M 1242 210 V 247 H 800 V 285" class="edge"/>
<path d="M 1464 210 V 247 H 800 V 285" class="edge"/>
<rect x="350" y="500" width="900" height="125" rx="12" fill="#2b214d" stroke="#8467d7" stroke-width="2"/>
