<text x="710" y="175" class="box-text">no Hodge PE</text>
<text x="710" y="194" class="box-text">encode -&gt; [31,128]</text>
<rect x="918" y="105" width="205" height="105" rx="12" fill="#252052" stroke="#8467d7" stroke-width="2"/>
<text x="932" y="132" class="box-title">branch_ac</text>
<text x="932" y="156" class="box-text">x [536, 13]</text>
<text x="932" y="175" class="box-text">Hodge PE +8</text>
<text x="932" y="194" class="box-text">encode -&gt; [536,128]</text>
<rect x="1140" y="105" width="205" height="105" rx="12" fill="#252052" stroke="#8467d7" stroke-width="2"/>
