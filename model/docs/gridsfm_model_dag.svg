<text x="364" y="936" class="box-text">264 -&gt; 64 -&gt; 1</text>
<text x="364" y="955" class="box-text">apply physical limits / anchor</text>
<rect x="665" y="885" width="270" height="90" rx="12" fill="#162443" stroke="#52678f" stroke-width="2"/>
<text x="679" y="912" class="box-title">theta head + DC prior</text>
<text x="679" y="936" class="box-text">264 -&gt; 64 -&gt; 1</text>
<text x="679" y="955" class="box-text">apply physical limits / anchor</text>
<rect x="980" y="885" width="270" height="90" rx="12" fill="#162443" stroke="#52678f" stroke-width="2"/>
<text x="994" y="912" class="box-title">V head + setpoint</text>
<text x="994" y="936" class="box-text">265 -&gt; 64 -&gt; 1</text>
<text x="994" y="955" class="box-text">apply physical limits / anchor</text>
<path d="M 800 795 V 840 H 170 V 885" class="edge"/>
<path d="M 800 795 V 840 H 485 V 885" class="edge"/>
<path d="M 270 795 V 840 H 800 V 885" class="edge"/>
<path d="M 270 795 V 840 H 1115 V 885" class="edge"/>
<path d="M 1330 795 V 840 H 170 V 885" class="context"/>
<text x="756" y="834" class="edge-label">global + ctx[8]</text>
<path d="M 1330 795 V 840 H 485 V 885" class="context"/>
