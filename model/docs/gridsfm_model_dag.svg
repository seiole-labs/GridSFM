<text x="49" y="936" class="box-text">264 -&gt; 64 -&gt; 1</text>
<text x="49" y="955" class="box-text">apply physical limits / anchor</text>
<rect x="350" y="885" width="270" height="90" rx="12" fill="#162443" stroke="#52678f" stroke-width="2"/>
